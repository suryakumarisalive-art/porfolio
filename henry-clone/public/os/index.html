<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio OS</title>
  <!-- js-dos v8 — runs the DOS games (Doom shareware, Oregon Trail, Scrabble) -->
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <link rel="stylesheet" href="os.css" />
</head>
<body>

  <!-- Desktop surface (icons + windows mount here) -->
  <div class="desktop" id="desktop"></div>

  <!-- Start menu -->
  <div class="start-menu hidden" id="start-menu">
    <div class="start-rail" id="start-rail">PortfolioOS</div>
    <div class="start-list" id="start-list"></div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button class="start-btn" id="start-btn"><span class="start-logo">⊞</span> Start</button>
    <div class="task-divider"></div>
    <div class="task-btns" id="task-btns"></div>
    <div class="tray">
      <span class="vol" title="Volume">🔊</span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </div>

  <!-- Shutdown sequence overlay -->
  <div id="shutdown" class="hidden"></div>

  <!-- Owner content (edit config.js to personalise everything) -->
  <script src="config.js"></script>

  <!-- Apps register into window.OSApps before the core boots -->
  <script src="apps/showcase.js"></script>
  <script src="apps/henordle.js"></script>
  <script src="apps/credits.js"></script>
  <script src="os.js"></script>
</body>
</html>
