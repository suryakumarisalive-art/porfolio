<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — 3D Showcase</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- WebGL canvas (pointer-events: none — UI layer handles mouse) -->
  <canvas id="webgl" class="webgl"></canvas>

  <!-- CSS3DRenderer container — iframe lives here in 3D space -->
  <div id="css"></div>

  <!-- Hidden video elements used as monitor texture source -->
  <div id="monitor-videos">
    <video id="monitor-video" loop muted playsinline crossorigin="anonymous"></video>
  </div>

  <!-- UI layer — centred flex, handles all mouse events -->
  <div id="ui-app">
    <div id="ui">

      <!-- BIOS-style loading + start screen (rendered by LoadingScreen.js) -->
      <div id="loading-screen"></div>

      <!-- Top-left controls (mute etc) — shown after loading -->
      <div id="ui-interactive" class="hidden">
        <button id="mute-btn" class="icon-btn" title="Toggle sound" aria-label="Toggle sound">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile fallback -->
  <div id="mobile-fallback" class="hidden">
    <div class="loading-screen-body" style="max-width:480px">
      <p>Portfolio Showcase <span class="blinking-cursor"></span></p>
      <br/>
      <p>The 3D experience works best on desktop.</p>
      <br/>
      <p>Visit on a larger screen for the full room.</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
